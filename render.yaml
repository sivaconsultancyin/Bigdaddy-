services:
  - type: web
    runtime: node
    name: bigdaddy-backend
    region: singapore
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:backend
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health
    envVars:
      - key: APP_MODE
        value: production
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://bigdaddy-frontend.onrender.com
      - key: JWT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: AUTHORITATIVE_GAME_ENGINE_ENABLED
        value: "false"
