name: BigDaddy Casino CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Run lint and type check
      run: npm run lint

    - name: Execute automated financial & authorization tests
      run: npm test

    - name: Build frontend application
      run: npm run build
