name: BigDaddy Casino CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install

    - name: Run lint and type check
      run: bun run lint

    - name: Execute automated financial & authorization tests
      run: bun run test

    - name: Build frontend application
      run: bun run build
