name: BigDaddy Casino CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install

    - name: Run lint and type check
      run: bun run lint

    - name: Execute automated financial & authorization tests
      run: bun run test

    - name: Verify production build fails without public Supabase config
      run: |
        if env -u VITE_SUPABASE_URL -u VITE_SUPABASE_PUBLISHABLE_KEY bun run build; then
          echo "Production build unexpectedly succeeded without required Supabase public config" >&2
          exit 1
        fi

    - name: Build frontend application with CI-only public Supabase config
      env:
        VITE_SUPABASE_URL: https://ci-project.supabase.co
        VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_test_key_12345678901234567890
      run: bun run build

  validate-schema-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
    - uses: actions/checkout@v4

    - name: Install PostgreSQL client
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-client

    - name: Create Supabase role fixtures
      run: |
        psql -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN;"

    - name: Apply schema preparation migration
      run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261021100000_prepare_game_schema_isolation.sql

    - name: Verify schema access boundaries
      run: |
        psql -v ON_ERROR_STOP=1 <<'SQL'
        DO $verify$
        DECLARE
          schema_name text;
        BEGIN
          FOREACH schema_name IN ARRAY ARRAY[
            'platform', 'wallet', 'aviator', 'roulette', 'dice',
            'dragon_tiger', 'andar_bahar', 'teen_patti'
          ] LOOP
            IF NOT EXISTS (
              SELECT 1 FROM pg_namespace WHERE nspname = schema_name
            ) THEN
              RAISE EXCEPTION 'Missing schema: %', schema_name;
            END IF;

            IF has_schema_privilege('anon', schema_name, 'USAGE')
               OR has_schema_privilege('authenticated', schema_name, 'USAGE') THEN
              RAISE EXCEPTION 'Client role unexpectedly has USAGE on schema %', schema_name;
            END IF;

            IF NOT has_schema_privilege('service_role', schema_name, 'USAGE') THEN
              RAISE EXCEPTION 'service_role lacks USAGE on schema %', schema_name;
            END IF;
          END LOOP;
        END
        $verify$;
        SQL

    - name: Verify schema migration is repeatable
      run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261021100000_prepare_game_schema_isolation.sql

    - name: Create minimal wallet function test fixtures
      run: |
        psql -v ON_ERROR_STOP=1 <<'SQL'
        CREATE TYPE public.transaction_type_enum AS ENUM ('BET_ESCROW_LOCK');
        CREATE TABLE public.wallets (
          id uuid PRIMARY KEY,
          balance bigint NOT NULL,
          reserved_balance bigint NOT NULL DEFAULT 0,
          updated_at timestamptz NOT NULL DEFAULT now()
        );
        CREATE TABLE public.wallet_transactions (
          id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
          idempotency_key varchar(128) NOT NULL UNIQUE,
          type public.transaction_type_enum NOT NULL,
          amount bigint NOT NULL,
          source_wallet_id uuid NOT NULL,
          target_wallet_id uuid NOT NULL,
          metadata jsonb NOT NULL DEFAULT '{}'::jsonb
        );
        CREATE TABLE public.ledger_entries (
          transaction_id uuid NOT NULL,
          wallet_id uuid NOT NULL,
          direction text NOT NULL,
          amount bigint NOT NULL,
          balance_after bigint NOT NULL,
          description text NOT NULL
        );
        CREATE TABLE public.token_supply (
          id integer PRIMARY KEY,
          max_supply bigint NOT NULL
        );
        INSERT INTO public.wallets(id, balance, reserved_balance) VALUES
          ('00000000-0000-0000-0000-000000000001', 1000, 0),
          ('00000000-0000-0000-0000-000000000002', 0, 0);
        INSERT INTO public.token_supply(id, max_supply) VALUES (1, 1000);
        SQL

    - name: Apply wallet idempotency hardening migration
      run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261021110000_harden_wallet_transfer_idempotency.sql

    - name: Apply wallet API boundary migration
      run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261021120000_wallet_transfer_api_boundary.sql

    - name: Verify exact replay and conflicting-key rejection
      run: |
        psql -v ON_ERROR_STOP=1 <<'SQL'
        DO $verify$
        DECLARE
          first_id uuid;
          replay_id uuid;
          conflict_rejected boolean := false;
        BEGIN
          first_id := public.wallet_transfer_atomic(
            'wallet-test-key-0001', 'BET_ESCROW_LOCK', 100,
            '00000000-0000-0000-0000-000000000001',
            '00000000-0000-0000-0000-000000000002',
            '{"purpose":"ci-test"}'::jsonb
          );
          replay_id := public.wallet_transfer_atomic(
            'wallet-test-key-0001', 'BET_ESCROW_LOCK', 100,
            '00000000-0000-0000-0000-000000000001',
            '00000000-0000-0000-0000-000000000002',
            '{"purpose":"ci-test"}'::jsonb
          );
          IF first_id IS DISTINCT FROM replay_id THEN
            RAISE EXCEPTION 'Exact idempotent replay returned a different transaction';
          END IF;

          BEGIN
            PERFORM public.wallet_transfer_atomic(
              'wallet-test-key-0001', 'BET_ESCROW_LOCK', 101,
              '00000000-0000-0000-0000-000000000001',
              '00000000-0000-0000-0000-000000000002',
              '{"purpose":"ci-test"}'::jsonb
            );
          EXCEPTION WHEN SQLSTATE '22023' THEN
            conflict_rejected := true;
          END;

          IF NOT conflict_rejected THEN
            RAISE EXCEPTION 'Conflicting idempotency-key reuse was not rejected';
          END IF;
          IF (SELECT balance FROM public.wallets WHERE id='00000000-0000-0000-0000-000000000001') <> 900
             OR (SELECT balance FROM public.wallets WHERE id='00000000-0000-0000-0000-000000000002') <> 100 THEN
            RAISE EXCEPTION 'Wallet balances do not match the single transfer';
          END IF;
          IF (SELECT count(*) FROM public.ledger_entries) <> 2 THEN
            RAISE EXCEPTION 'Expected exactly two double-entry ledger rows';
          END IF;
        END
        $verify$;
        SQL

    - name: Verify concurrent wallet transfers serialize and replay exactly once
      shell: bash
      run: |
        set -euo pipefail
        psql -v ON_ERROR_STOP=1 <<'SQL'
        UPDATE public.wallets SET balance=1000 WHERE id='00000000-0000-0000-0000-000000000001';
        UPDATE public.wallets SET balance=0 WHERE id='00000000-0000-0000-0000-000000000002';
        SQL

        psql -v ON_ERROR_STOP=1 -At -c "SELECT public.wallet_transfer_atomic('wallet-concurrent-key-0001','BET_ESCROW_LOCK',100,'00000000-0000-0000-0000-000000000001','00000000-0000-0000-0000-000000000002','{\"purpose\":\"concurrent-replay\"}'::jsonb)" > /tmp/wallet-concurrent-a.out &
        first_pid=$!
        psql -v ON_ERROR_STOP=1 -At -c "SELECT public.wallet_transfer_atomic('wallet-concurrent-key-0001','BET_ESCROW_LOCK',100,'00000000-0000-0000-0000-000000000001','00000000-0000-0000-0000-000000000002','{\"purpose\":\"concurrent-replay\"}'::jsonb)" > /tmp/wallet-concurrent-b.out &
        second_pid=$!
        wait "$first_pid"
        wait "$second_pid"
        test "$(cat /tmp/wallet-concurrent-a.out)" = "$(cat /tmp/wallet-concurrent-b.out)"

        psql -v ON_ERROR_STOP=1 <<'SQL'
        DO $verify$
        DECLARE
          tx_id uuid;
        BEGIN
          SELECT id INTO tx_id FROM public.wallet_transactions
          WHERE idempotency_key='wallet-concurrent-key-0001';
          IF tx_id IS NULL
             OR (SELECT count(*) FROM public.wallet_transactions WHERE idempotency_key='wallet-concurrent-key-0001') <> 1
             OR (SELECT count(*) FROM public.ledger_entries WHERE transaction_id=tx_id) <> 2
             OR (SELECT balance FROM public.wallets WHERE id='00000000-0000-0000-0000-000000000001') <> 900
             OR (SELECT balance FROM public.wallets WHERE id='00000000-0000-0000-0000-000000000002') <> 100 THEN
            RAISE EXCEPTION 'Concurrent exact replay did not produce one transfer and two ledger entries';
          END IF;
        END
        $verify$;
        SQL

        psql -v ON_ERROR_STOP=1 <<'SQL'
        UPDATE public.wallets SET balance=900 WHERE id='00000000-0000-0000-0000-000000000001';
        UPDATE public.wallets SET balance=100 WHERE id='00000000-0000-0000-0000-000000000002';
        SQL

        psql -v ON_ERROR_STOP=1 -c "SELECT public.wallet_transfer_atomic('wallet-concurrent-distinct-a','BET_ESCROW_LOCK',400,'00000000-0000-0000-0000-000000000001','00000000-0000-0000-0000-000000000002','{\"purpose\":\"concurrent-a\"}'::jsonb)" &
        first_pid=$!
        psql -v ON_ERROR_STOP=1 -c "SELECT public.wallet_transfer_atomic('wallet-concurrent-distinct-b','BET_ESCROW_LOCK',500,'00000000-0000-0000-0000-000000000001','00000000-0000-0000-0000-000000000002','{\"purpose\":\"concurrent-b\"}'::jsonb)" &
        second_pid=$!
        wait "$first_pid"
        wait "$second_pid"

        psql -v ON_ERROR_STOP=1 <<'SQL'
        DO $verify$
        BEGIN
          IF (SELECT balance FROM public.wallets WHERE id='00000000-0000-0000-0000-000000000001') <> 0
             OR (SELECT balance FROM public.wallets WHERE id='00000000-0000-0000-0000-000000000002') <> 1000
             OR (SELECT count(*) FROM public.wallet_transactions WHERE idempotency_key IN ('wallet-concurrent-distinct-a','wallet-concurrent-distinct-b')) <> 2
             OR (SELECT count(*) FROM public.ledger_entries le JOIN public.wallet_transactions wt ON wt.id=le.transaction_id WHERE wt.idempotency_key IN ('wallet-concurrent-distinct-a','wallet-concurrent-distinct-b')) <> 4 THEN
            RAISE EXCEPTION 'Concurrent distinct transfers lost an update or violated double-entry accounting';
          END IF;
        END
        $verify$;
        SQL

        # Remove concurrency-only records and restore the post-idempotency fixture state
        # so the following wallet-boundary assertions remain isolated.
        psql -v ON_ERROR_STOP=1 <<'SQL'
        DELETE FROM public.ledger_entries
        WHERE transaction_id IN (
          SELECT id FROM public.wallet_transactions
          WHERE idempotency_key IN (
            'wallet-concurrent-key-0001',
            'wallet-concurrent-distinct-a',
            'wallet-concurrent-distinct-b'
          )
        );
        DELETE FROM public.wallet_transactions
        WHERE idempotency_key IN (
          'wallet-concurrent-key-0001',
          'wallet-concurrent-distinct-a',
          'wallet-concurrent-distinct-b'
        );
        UPDATE public.wallets SET balance=900 WHERE id='00000000-0000-0000-0000-000000000001';
        UPDATE public.wallets SET balance=100 WHERE id='00000000-0000-0000-0000-000000000002';
        SQL

    - name: Verify wallet API boundary grants and execution
      run: |
        psql -v ON_ERROR_STOP=1 <<'SQL'
        DO $verify$
        BEGIN
          IF has_function_privilege('anon', 'wallet.wallet_transfer_atomic(text,public.transaction_type_enum,bigint,uuid,uuid,jsonb)', 'EXECUTE') THEN
            RAISE EXCEPTION 'anon unexpectedly has wallet API execute privilege';
          END IF;
          IF has_function_privilege('authenticated', 'wallet.wallet_transfer_atomic(text,public.transaction_type_enum,bigint,uuid,uuid,jsonb)', 'EXECUTE') THEN
            RAISE EXCEPTION 'authenticated unexpectedly has wallet API execute privilege';
          END IF;
          IF NOT has_function_privilege('service_role', 'wallet.wallet_transfer_atomic(text,public.transaction_type_enum,bigint,uuid,uuid,jsonb)', 'EXECUTE') THEN
            RAISE EXCEPTION 'service_role cannot execute wallet API';
          END IF;
        END
        $verify$;

        SET ROLE service_role;
        SELECT wallet.wallet_transfer_atomic(
          'wallet-wrapper-key-0002', 'BET_ESCROW_LOCK', 50,
          '00000000-0000-0000-0000-000000000001',
          '00000000-0000-0000-0000-000000000002',
          '{"purpose":"wrapper-test"}'::jsonb
        );
        RESET ROLE;

        DO $verify$
        BEGIN
          IF (SELECT balance FROM public.wallets WHERE id='00000000-0000-0000-0000-000000000001') <> 850
             OR (SELECT balance FROM public.wallets WHERE id='00000000-0000-0000-0000-000000000002') <> 150 THEN
            RAISE EXCEPTION 'Wallet wrapper did not execute exactly one transfer';
          END IF;
          IF (SELECT count(*) FROM public.ledger_entries) <> 4 THEN
            RAISE EXCEPTION 'Wallet wrapper did not create exactly two additional ledger rows';
          END IF;
        END
        $verify$;
        SQL


    - name: Verify wallet transfer fully rolls back on ledger failure
      run: |
        psql -v ON_ERROR_STOP=1 <<'SQL'
        CREATE FUNCTION public.ci_reject_ledger_insert()
        RETURNS trigger
        LANGUAGE plpgsql
        AS $function$
        BEGIN
          RAISE EXCEPTION 'ci_injected_ledger_failure' USING ERRCODE = 'P0001';
        END;
        $function$;

        CREATE TRIGGER ci_reject_ledger_insert
        BEFORE INSERT ON public.ledger_entries
        FOR EACH ROW EXECUTE FUNCTION public.ci_reject_ledger_insert();

        DO $verify$
        DECLARE
          failure_seen boolean := false;
        BEGIN
          BEGIN
            PERFORM public.wallet_transfer_atomic(
              'wallet-rollback-failure-0001', 'BET_ESCROW_LOCK', 25,
              '00000000-0000-0000-0000-000000000001',
              '00000000-0000-0000-0000-000000000002',
              '{"purpose":"rollback-test"}'::jsonb
            );
          EXCEPTION WHEN SQLSTATE 'P0001' THEN
            failure_seen := true;
          END;

          IF NOT failure_seen THEN
            RAISE EXCEPTION 'Injected ledger failure did not abort wallet transfer';
          END IF;

          IF (SELECT balance FROM public.wallets WHERE id='00000000-0000-0000-0000-000000000001') <> 850
             OR (SELECT balance FROM public.wallets WHERE id='00000000-0000-0000-0000-000000000002') <> 150 THEN
            RAISE EXCEPTION 'Wallet balances changed despite ledger failure';
          END IF;

          IF EXISTS (
            SELECT 1 FROM public.wallet_transactions
            WHERE idempotency_key='wallet-rollback-failure-0001'
          ) OR EXISTS (
            SELECT 1 FROM public.ledger_entries le
            JOIN public.wallet_transactions wt ON wt.id=le.transaction_id
            WHERE wt.idempotency_key='wallet-rollback-failure-0001'
          ) THEN
            RAISE EXCEPTION 'Partial transaction or ledger rows survived failed wallet transfer';
          END IF;
        END
        $verify$;

        DROP TRIGGER ci_reject_ledger_insert ON public.ledger_entries;
        DROP FUNCTION public.ci_reject_ledger_insert();
        SQL


  validate-schema-cutover:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
    - uses: actions/checkout@v4

    - name: Install PostgreSQL client
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-client

    - name: Create isolated schema-cutover fixture
      run: psql -v ON_ERROR_STOP=1 -f scripts/db/schema-cutover-fixture.sql

    - name: Apply transactional schema cutover
      run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261021130000_move_platform_wallet_aviator_tables.sql

    - name: Verify tables, compatibility views, and function boundaries
      run: |
        psql -v ON_ERROR_STOP=1 <<'SQL'
        DO $verify$
        DECLARE
          name text;
        BEGIN
          FOREACH name IN ARRAY ARRAY['users','user_profiles','role_assignments','referral_codes','audit_logs','token_requests','user_sessions','games','game_pools'] LOOP
            IF to_regclass('platform.' || name) IS NULL OR (SELECT relkind FROM pg_class WHERE oid=to_regclass('public.' || name)) <> 'v' THEN
              RAISE EXCEPTION 'Platform table/view cutover incomplete for %', name;
            END IF;
          END LOOP;
          FOREACH name IN ARRAY ARRAY['wallets','wallet_transactions','ledger_entries','token_supply'] LOOP
            IF to_regclass('wallet.' || name) IS NULL OR (SELECT relkind FROM pg_class WHERE oid=to_regclass('public.' || name)) <> 'v' THEN
              RAISE EXCEPTION 'Wallet table/view cutover incomplete for %', name;
            END IF;
          END LOOP;
          FOREACH name IN ARRAY ARRAY['game_rounds','game_bets','game_settlements'] LOOP
            IF to_regclass('aviator.' || name) IS NULL OR (SELECT relkind FROM pg_class WHERE oid=to_regclass('public.' || name)) <> 'v' THEN
              RAISE EXCEPTION 'Aviator table/view cutover incomplete for %', name;
            END IF;
          END LOOP;
          IF to_regprocedure('wallet.wallet_transfer_atomic(text,public.transaction_type_enum,bigint,uuid,uuid,jsonb)') IS NULL
             OR to_regprocedure('aviator.place_crash_bet_atomic(uuid,uuid,bigint,text,numeric)') IS NULL
             OR to_regprocedure('aviator.cashout_crash_bet_atomic(uuid,uuid,text)') IS NULL
             OR to_regprocedure('aviator.settle_crash_round_atomic(uuid)') IS NULL THEN
            RAISE EXCEPTION 'Schema-owned financial/game functions are missing';
          END IF;
          IF has_schema_privilege('anon','wallet','USAGE') OR has_schema_privilege('authenticated','aviator','USAGE') THEN
            RAISE EXCEPTION 'Browser role can access a private schema';
          END IF;
          IF NOT has_function_privilege('service_role','wallet.wallet_transfer_atomic(text,public.transaction_type_enum,bigint,uuid,uuid,jsonb)','EXECUTE') THEN
            RAISE EXCEPTION 'service_role cannot execute wallet transfer API';
          END IF;
          IF to_regclass('public.authoritative_game_rounds') IS NULL OR to_regclass('public.authoritative_game_bets') IS NULL THEN
            RAISE EXCEPTION 'Authoritative game compatibility tables were unexpectedly removed';
          END IF;
          IF EXISTS (
            SELECT 1 FROM platform.games g JOIN wallet.wallets w ON w.id=g.pool_wallet_id
            WHERE g.code <> 'aviator' AND g.status='COMING_SOON' AND w.game_code <> g.code
          ) THEN
            RAISE EXCEPTION 'Coming-soon game still points at a different game pool';
          END IF;
          IF (SELECT balance FROM wallet.wallets WHERE game_code='aviator') <> 1000266
             OR EXISTS (SELECT 1 FROM wallet.wallets WHERE game_code <> 'aviator' AND (balance <> 0 OR reserved_balance <> 0)) THEN
            RAISE EXCEPTION 'Pool reconciliation unexpectedly changed wallet balances/reservations';
          END IF;
        END
        $verify$;
        SQL

    - name: Apply per-game authoritative schema split
      run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261021140000_split_authoritative_games_by_schema.sql

    - name: Verify per-game tables, foreign keys, and preserved history
      run: |
        psql -v ON_ERROR_STOP=1 <<'SQL'
        DO $verify$
        DECLARE
          schema_name text;
          table_name text;
        BEGIN
          FOREACH schema_name IN ARRAY ARRAY['roulette','dice','dragon_tiger','andar_bahar'] LOOP
            IF to_regclass(format('%I.authoritative_game_rounds', schema_name)) IS NULL
               OR to_regclass(format('%I.authoritative_game_bets', schema_name)) IS NULL THEN
              RAISE EXCEPTION 'Missing per-game tables in schema %', schema_name;
            END IF;
            IF has_schema_privilege('anon', schema_name, 'USAGE')
               OR has_schema_privilege('authenticated', schema_name, 'USAGE') THEN
              RAISE EXCEPTION 'Browser role can access schema %', schema_name;
            END IF;
            IF NOT has_schema_privilege('service_role', schema_name, 'USAGE') THEN
              RAISE EXCEPTION 'service_role cannot access schema %', schema_name;
            END IF;
          END LOOP;

          IF (SELECT count(*) FROM roulette.authoritative_game_rounds) <> 1
             OR (SELECT count(*) FROM dice.authoritative_game_rounds) <> 1
             OR (SELECT count(*) FROM dragon_tiger.authoritative_game_rounds) <> 1
             OR (SELECT count(*) FROM andar_bahar.authoritative_game_rounds) <> 1 THEN
            RAISE EXCEPTION 'Settled round history was not split by game';
          END IF;
          IF (SELECT count(*) FROM roulette.authoritative_game_bets) <> 1
             OR (SELECT count(*) FROM dice.authoritative_game_bets) <> 1
             OR (SELECT count(*) FROM dragon_tiger.authoritative_game_bets) <> 1
             OR (SELECT count(*) FROM andar_bahar.authoritative_game_bets) <> 1 THEN
            RAISE EXCEPTION 'Bet history was not split by game';
          END IF;
          IF EXISTS (SELECT 1 FROM roulette.authoritative_game_rounds WHERE game_code <> 'roulette')
             OR EXISTS (SELECT 1 FROM dice.authoritative_game_rounds WHERE game_code <> 'dice')
             OR EXISTS (SELECT 1 FROM dragon_tiger.authoritative_game_rounds WHERE game_code <> 'dragon_tiger')
             OR EXISTS (SELECT 1 FROM andar_bahar.authoritative_game_rounds WHERE game_code <> 'andar_bahar') THEN
            RAISE EXCEPTION 'Round rows are present in the wrong game schema';
          END IF;
          IF (SELECT count(*) FROM public.authoritative_game_rounds) <> 4
             OR (SELECT count(*) FROM public.authoritative_game_bets) <> 4 THEN
            RAISE EXCEPTION 'Read-only compatibility views do not preserve all history';
          END IF;
          IF (SELECT relkind FROM pg_class WHERE oid=to_regclass('public.authoritative_game_rounds')) <> 'v'
             OR (SELECT relkind FROM pg_class WHERE oid=to_regclass('public.authoritative_game_bets')) <> 'v' THEN
            RAISE EXCEPTION 'Shared public runtime objects are not compatibility views';
          END IF;
          IF NOT EXISTS (
            SELECT 1 FROM pg_constraint
            WHERE conrelid='roulette.authoritative_game_bets'::regclass
              AND confrelid='roulette.authoritative_game_rounds'::regclass
          ) OR NOT EXISTS (
            SELECT 1 FROM pg_constraint
            WHERE conrelid='dice.authoritative_game_bets'::regclass
              AND confrelid='dice.authoritative_game_rounds'::regclass
          ) OR NOT EXISTS (
            SELECT 1 FROM pg_constraint
            WHERE conrelid='dragon_tiger.authoritative_game_bets'::regclass
              AND confrelid='dragon_tiger.authoritative_game_rounds'::regclass
          ) OR NOT EXISTS (
            SELECT 1 FROM pg_constraint
            WHERE conrelid='andar_bahar.authoritative_game_bets'::regclass
              AND confrelid='andar_bahar.authoritative_game_rounds'::regclass
          ) THEN
            RAISE EXCEPTION 'Per-game bet-to-round foreign keys are missing';
          END IF;
        END
        $verify$;
        SQL

    - name: Apply Andar Bahar lifecycle migration and provision isolated fixtures
      run: |
        psql -v ON_ERROR_STOP=1 <<'SQL'
        CREATE SCHEMA IF NOT EXISTS extensions;
        CREATE EXTENSION IF NOT EXISTS pgcrypto WITH SCHEMA extensions;
        GRANT USAGE ON SCHEMA extensions TO service_role;
        ALTER TYPE public.transaction_type_enum ADD VALUE IF NOT EXISTS 'BET_ESCROW_REFUND';
        ALTER TYPE public.transaction_type_enum ADD VALUE IF NOT EXISTS 'BET_WIN_PAYOUT';
        ALTER TYPE public.transaction_type_enum ADD VALUE IF NOT EXISTS 'BET_LOSS_GAME_POOL';
        UPDATE platform.games
          SET pool_wallet_id=(SELECT id FROM wallet.wallets WHERE game_code='andar_bahar')
          WHERE code='andar_bahar';
        UPDATE platform.game_pools
          SET wallet_id=(SELECT id FROM wallet.wallets WHERE game_code='andar_bahar')
          WHERE game_code='andar_bahar';
        UPDATE wallet.wallets SET balance=1000000,reserved_balance=0
          WHERE game_code='andar_bahar' AND wallet_type='GAME_POOL';
        UPDATE andar_bahar.authoritative_game_rounds
          SET settled_at=now()-interval '10 seconds'
          WHERE round_number=1 AND status='SETTLED';
        CREATE OR REPLACE FUNCTION public.wallet_transfer_atomic(
          p_idempotency_key text,p_type public.transaction_type_enum,p_amount bigint,
          p_source_wallet_id uuid,p_target_wallet_id uuid,p_metadata jsonb DEFAULT '{}'::jsonb
        ) RETURNS uuid LANGUAGE plpgsql SECURITY DEFINER
        SET search_path=pg_catalog,pg_temp AS $function$
        DECLARE v_id uuid;
        BEGIN
          INSERT INTO wallet.wallet_transactions(idempotency_key,type,amount,source_wallet_id,target_wallet_id,metadata)
          VALUES(p_idempotency_key,p_type,p_amount,p_source_wallet_id,p_target_wallet_id,coalesce(p_metadata,'{}'::jsonb))
          RETURNING id INTO v_id;
          RETURN v_id;
        END;
        $function$;
        INSERT INTO wallet.wallets(user_id,wallet_type,balance,reserved_balance)
        VALUES('20000000-0000-0000-0000-000000000001','PLAYER',1000,0);
        INSERT INTO wallet.wallets(wallet_type,balance,reserved_balance)
        VALUES('ESCROW',1000000,0);
        UPDATE platform.games SET status='ACTIVE' WHERE code='andar_bahar';
        SQL
        psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261111120000_andar_bahar_authoritative_round_lifecycle.sql

    - name: Verify Andar Bahar lifecycle, card sequence, settlement and idempotency
      run: |
        psql -v ON_ERROR_STOP=1 <<'SQL'
        SET ROLE service_role;
        SELECT g.code,g.status,g.pool_wallet_id,gp.wallet_id,w.wallet_type::text,w.game_code,w.balance,w.reserved_balance
          FROM platform.games g LEFT JOIN platform.game_pools gp ON gp.game_code=g.code
          LEFT JOIN wallet.wallets w ON w.id=g.pool_wallet_id WHERE g.code='andar_bahar';
        DO $verify$
        DECLARE
          v_round andar_bahar.authoritative_game_rounds%ROWTYPE;
          v_first_id uuid;
          v_winner text;
          v_loser text;
          v_result jsonb;
          v_dealt integer;
          v_joker_rank integer;
          v_last_rank integer;
          v_matching_cards integer;
          v_card jsonb;
          v_side text;
          v_expected_side text;
          v_count integer := 0;
          v_failed boolean := false;\n          v_state jsonb;
        BEGIN
          PERFORM andar_bahar.advance_round();
          SELECT * INTO v_round FROM andar_bahar.authoritative_game_rounds
            WHERE game_code='andar_bahar' ORDER BY round_number DESC LIMIT 1;
          IF v_round.status <> 'BETTING' OR v_round.server_seed IS NULL
             OR encode(extensions.digest(v_round.server_seed,'sha256'),'hex') <> v_round.server_seed_hash THEN
            RAISE EXCEPTION 'Andar Bahar did not create a committed betting round; state=%',v_state;
          END IF;
          v_first_id := v_round.id;
          PERFORM andar_bahar.advance_round();
          IF (SELECT count(*) FROM andar_bahar.authoritative_game_rounds WHERE status='BETTING') <> 1
             OR (SELECT id FROM andar_bahar.authoritative_game_rounds WHERE status='BETTING') <> v_first_id THEN
            RAISE EXCEPTION 'Repeated lifecycle call created a duplicate betting round';
          END IF;

          UPDATE andar_bahar.authoritative_game_rounds
            SET opened_at=clock_timestamp()-interval '20 seconds', betting_closes_at=clock_timestamp()-interval '1 second' WHERE id=v_first_id;
          PERFORM andar_bahar.advance_round();
          SELECT * INTO v_round FROM andar_bahar.authoritative_game_rounds WHERE id=v_first_id;
          IF v_round.status <> 'RUNNING' OR v_round.result IS NULL THEN
            RAISE EXCEPTION 'Expired betting round did not enter RUNNING with a server result';
          END IF;
          v_result := v_round.result;
          v_joker_rank := (v_result->'jokerCard'->>'rank')::integer;
          v_dealt := jsonb_array_length(v_result->'dealCards');
          IF v_dealt < 1 OR v_dealt > 51 THEN RAISE EXCEPTION 'Invalid deal length'; END IF;
          IF (v_result->'dealCards'->(v_dealt-1)->'card'->>'rank')::integer <> v_joker_rank THEN
            RAISE EXCEPTION 'Final dealt card does not match Joker rank';
          END IF;
          SELECT count(*) INTO v_matching_cards
            FROM jsonb_array_elements(v_result->'dealCards') d
            WHERE (d->'card'->>'rank')::integer=v_joker_rank;
          IF v_matching_cards <> 1 THEN RAISE EXCEPTION 'Deal did not stop at the first Joker-rank match'; END IF;
          FOR v_card,v_side IN
            SELECT value->'card',value->>'side' FROM jsonb_array_elements(v_result->'dealCards')
          LOOP
            v_expected_side := CASE WHEN v_count % 2 = 0 THEN 'bahar' ELSE 'andar' END;
            IF v_side <> v_expected_side THEN RAISE EXCEPTION 'Andar/Bahar dealing order is not alternating'; END IF;
            v_count := v_count + 1;
          END LOOP;
          v_winner := v_result->>'winner';
          v_loser := CASE WHEN v_winner='andar' THEN 'bahar' ELSE 'andar' END;
          INSERT INTO andar_bahar.authoritative_game_bets(round_id,user_id,bet_amount,selection,status,reserved_liability,idempotency_key)
          VALUES
            (v_first_id,'20000000-0000-0000-0000-000000000001',10,jsonb_build_object('type',v_winner),'PENDING',20,'ci-andar-winner-0001'),
            (v_first_id,'20000000-0000-0000-0000-000000000001',10,jsonb_build_object('type',v_loser),'PENDING',20,'ci-andar-loser-0001'),
            (v_first_id,'20000000-0000-0000-0000-000000000001',10,jsonb_build_object('type',CASE WHEN v_result->'jokerCard'->>'suit' IN ('H','D') THEN 'joker_red' ELSE 'joker_black' END),'PENDING',20,'ci-joker-color-winner-0001'),
            (v_first_id,'20000000-0000-0000-0000-000000000001',10,jsonb_build_object('type',CASE WHEN v_result->'jokerCard'->>'suit' IN ('H','D') THEN 'joker_black' ELSE 'joker_red' END),'PENDING',20,'ci-joker-color-loser-0001');
          UPDATE wallet.wallets SET reserved_balance=reserved_balance+80
            WHERE game_code='andar_bahar' AND wallet_type='GAME_POOL';
          UPDATE andar_bahar.authoritative_game_rounds
            SET state=state||jsonb_build_object('dealStartedAt',clock_timestamp()-interval '5 seconds')
            WHERE id=v_first_id;
          PERFORM andar_bahar.advance_round();
          SELECT * INTO v_round FROM andar_bahar.authoritative_game_rounds WHERE id=v_first_id;
          IF v_round.status <> 'SETTLED' OR v_round.server_seed IS NULL THEN
            RAISE EXCEPTION 'Andar Bahar round did not settle/reveal its seed';
          END IF;
          IF (SELECT count(*) FROM andar_bahar.authoritative_game_bets WHERE round_id=v_first_id AND status='WON') <> 2
             OR (SELECT count(*) FROM andar_bahar.authoritative_game_bets WHERE round_id=v_first_id AND status='LOST') <> 2
             OR (v_winner='andar' AND (SELECT payout_amount FROM andar_bahar.authoritative_game_bets WHERE round_id=v_first_id AND selection->>'type'=v_winner) <> 20)
             OR (v_winner='bahar' AND (SELECT payout_amount FROM andar_bahar.authoritative_game_bets WHERE round_id=v_first_id AND selection->>'type'=v_winner) <> 19)
             OR (SELECT payout_amount FROM andar_bahar.authoritative_game_bets WHERE round_id=v_first_id AND selection->>'type'=v_loser) <> 0
             OR (SELECT count(*) FROM andar_bahar.authoritative_game_bets WHERE round_id=v_first_id AND selection->>'type' IN ('joker_red','joker_black') AND status='WON' AND payout_amount=19) <> 1
             OR (SELECT count(*) FROM andar_bahar.authoritative_game_bets WHERE round_id=v_first_id AND selection->>'type' IN ('joker_red','joker_black') AND status='LOST' AND payout_amount=0) <> 1 THEN
            RAISE EXCEPTION 'Winning/losing settlement amounts are incorrect';
          END IF;
          IF (SELECT count(*) FROM wallet.wallet_transactions WHERE metadata->>'gameCode'='andar_bahar' AND metadata->>'roundId'=v_first_id::text) <> 6 THEN
            RAISE EXCEPTION 'Expected stake-return, profit and losing-stake transfers for main and Joker-color bets';
          END IF;
          IF (SELECT reserved_balance FROM wallet.wallets WHERE game_code='andar_bahar' AND wallet_type='GAME_POOL') <> 0 THEN
            RAISE EXCEPTION 'Pool reserved liability was not fully released';
          END IF;
          UPDATE andar_bahar.authoritative_game_rounds
            SET settled_at=clock_timestamp()-interval '6 seconds' WHERE id=v_first_id;
          PERFORM andar_bahar.advance_round();
          IF (SELECT count(*) FROM andar_bahar.authoritative_game_rounds WHERE status='BETTING') <> 1 THEN
            RAISE EXCEPTION 'Next round was not created after settlement window';
          END IF;
          BEGIN
            INSERT INTO andar_bahar.authoritative_game_bets(round_id,user_id,bet_amount,selection,idempotency_key)
            VALUES(v_first_id,'20000000-0000-0000-0000-000000000001',10,'{"type":"not-a-side"}','ci-andar-invalid-0001');
          EXCEPTION WHEN SQLSTATE '22023' THEN v_failed := true;
          END;
          IF NOT v_failed THEN RAISE EXCEPTION 'Invalid Andar/Bahar selection was accepted'; END IF;
        END;
        $verify$;
        RESET ROLE;
        SQL

  validate-edge-functions:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Deno (retry transient download failures)
      shell: bash
      run: |
        set -euo pipefail
        installed=false
        for attempt in 1 2 3; do
          if curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 https://deno.land/install.sh | sh; then
            installed=true
            break
          fi
          echo "Deno install attempt ${attempt} failed; retrying..."
          sleep 5
        done
        if [ "${installed}" != "true" ]; then
          echo "Deno installation failed after retries" >&2
          exit 1
        fi
        echo "${HOME}/.deno/bin" >> "${GITHUB_PATH}"
        "${HOME}/.deno/bin/deno" --version

    - name: Type-check Supabase Edge API
      run: deno check --config supabase/functions/api/deno.json supabase/functions/api/index.ts

    - name: Type-check Aviator engine Edge Function
      run: deno check --config supabase/functions/api/deno.json supabase/functions/aviator-engine/index.ts

  validate-aviator-tick-retry:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Deno (retry transient download failures)
      shell: bash
      run: |
        set -euo pipefail
        curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 https://deno.land/install.sh | sh
        echo "${HOME}/.deno/bin" >> "${GITHUB_PATH}"
    - name: Test bounded retry behavior for PostgreSQL statement timeouts
      run: deno test supabase/functions/aviator-engine/retry_test.ts

  validate-aviator-engine-lease:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
    - uses: actions/checkout@v4

    - name: Install PostgreSQL client
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-client

    - name: Create Aviator lease and Realtime fixtures
      run: |
        psql -v ON_ERROR_STOP=1 <<'SQL'
        CREATE ROLE anon NOLOGIN;
        CREATE ROLE authenticated NOLOGIN;
        CREATE ROLE service_role NOLOGIN;
        CREATE SCHEMA aviator;
        CREATE SCHEMA realtime;
        GRANT USAGE ON SCHEMA aviator TO service_role;
        CREATE TABLE aviator.game_rounds (
          id uuid PRIMARY KEY,
          round_number bigint NOT NULL,
          status text NOT NULL,
          started_at timestamptz,
          crash_multiplier numeric,
          ended_at timestamptz,
          server_seed_hash text,
          revealed_server_seed text
        );
        CREATE TABLE realtime.broadcast_events (
          payload jsonb NOT NULL,
          event_name text NOT NULL,
          topic text NOT NULL
        );
        CREATE FUNCTION realtime.send(jsonb, text, text, boolean)
        RETURNS void LANGUAGE sql AS $function$
          INSERT INTO realtime.broadcast_events(payload, event_name, topic)
          VALUES ($1, $2, $3);
        $function$;
        CREATE FUNCTION aviator.tick_crash_engine()
        RETURNS jsonb LANGUAGE sql AS $function$
          SELECT jsonb_build_object(
            'action', 'round_running',
            'roundId', '00000000-0000-4000-8000-000000000001',
            'multiplier', 1.23
          );
        $function$;
        INSERT INTO aviator.game_rounds(id, round_number, status, started_at, crash_multiplier)
        VALUES ('00000000-0000-4000-8000-000000000001', 7, 'RUNNING', now(), 2.5);

        CREATE TABLE aviator.game_bets (
          id uuid PRIMARY KEY,
          round_id uuid NOT NULL REFERENCES aviator.game_rounds(id)
        );
        CREATE TABLE aviator.game_settlements (
          id uuid PRIMARY KEY,
          bet_id uuid NOT NULL REFERENCES aviator.game_bets(id),
          round_id uuid NOT NULL REFERENCES aviator.game_rounds(id)
        );

        CREATE INDEX idx_game_bets_round ON aviator.game_bets(round_id);
        CREATE INDEX idx_game_settlements_round_id ON aviator.game_settlements(round_id);

        CREATE TABLE public.rls_trigger_invocations(id bigserial PRIMARY KEY);
        CREATE FUNCTION public.rls_auto_enable()
        RETURNS event_trigger LANGUAGE plpgsql SECURITY DEFINER AS $function$
        BEGIN
          INSERT INTO public.rls_trigger_invocations DEFAULT VALUES;
        END;
        $function$;
        GRANT EXECUTE ON FUNCTION public.rls_auto_enable() TO PUBLIC, anon, authenticated, service_role;
        CREATE EVENT TRIGGER ensure_rls
          ON ddl_command_end EXECUTE FUNCTION public.rls_auto_enable();
        SQL

    - name: Apply canonical RLS auto-enable privilege migration
      run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261110130000_harden_rls_auto_enable_grants.sql

    - name: Apply Aviator lease and Realtime migrations
      run: |
        psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261108063629_aviator_engine_worker_lease.sql
        psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261108063705_aviator_multiplier_realtime_broadcast.sql
        psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261110120000_aviator_realtime_event_sequence.sql

    - name: Verify Aviator grants, indexes, and event trigger
      run: psql -v ON_ERROR_STOP=1 -f scripts/db/aviator-security-verify.sql

    - name: Verify single-worker lease, heartbeat, handoff, and multiplier broadcast
      run: |
        psql -v ON_ERROR_STOP=1 <<'SQL'
        DO $verify$
        DECLARE
          first_owner uuid := '00000000-0000-4000-8000-000000000011';
          duplicate_owner uuid := '00000000-0000-4000-8000-000000000012';
          handoff_token uuid := '00000000-0000-4000-8000-000000000013';
          next_owner uuid := '00000000-0000-4000-8000-000000000014';
          current_owner uuid;
        BEGIN
          IF aviator.claim_crash_engine_lease(first_owner, 9) THEN
            RAISE EXCEPTION 'Lease accepted a TTL below the minimum';
          END IF;
          IF NOT aviator.claim_crash_engine_lease(first_owner, 45) THEN
            RAISE EXCEPTION 'Initial lease claim failed';
          END IF;
          IF aviator.claim_crash_engine_lease(duplicate_owner, 45) THEN
            RAISE EXCEPTION 'Duplicate worker acquired an active lease';
          END IF;
          IF aviator.release_crash_engine_lease(duplicate_owner) THEN
            RAISE EXCEPTION 'Non-owner released the active worker lease';
          END IF;
          SELECT owner_token INTO current_owner FROM aviator.engine_worker_lease WHERE lease_key='aviator';
          IF current_owner IS DISTINCT FROM first_owner THEN
            RAISE EXCEPTION 'Failed non-owner release changed the lease owner';
          END IF;
          IF aviator.heartbeat_crash_engine_lease(first_owner, 121) THEN
            RAISE EXCEPTION 'Heartbeat accepted a TTL above the maximum';
          END IF;
          IF NOT aviator.heartbeat_crash_engine_lease(first_owner, 45) THEN
            RAISE EXCEPTION 'Lease heartbeat failed';
          END IF;
          IF NOT aviator.handoff_crash_engine_lease(first_owner, handoff_token, 60) THEN
            RAISE EXCEPTION 'Atomic lease handoff failed';
          END IF;
          IF aviator.heartbeat_crash_engine_lease(first_owner, 45)
             OR aviator.release_crash_engine_lease(first_owner) THEN
            RAISE EXCEPTION 'Previous worker retained control after handoff';
          END IF;
          IF aviator.consume_crash_engine_handoff(duplicate_owner, next_owner, 45) THEN
            RAISE EXCEPTION 'Invalid handoff token was accepted';
          END IF;
          IF NOT aviator.consume_crash_engine_handoff(handoff_token, next_owner, 45) THEN
            RAISE EXCEPTION 'Continuation did not consume handoff token';
          END IF;
          IF aviator.release_crash_engine_lease(handoff_token) THEN
            RAISE EXCEPTION 'Handoff token released the new owner lease';
          END IF;
          IF NOT aviator.heartbeat_crash_engine_lease(next_owner, 45) THEN
            RAISE EXCEPTION 'New owner heartbeat failed';
          END IF;
          IF NOT aviator.release_crash_engine_lease(next_owner) THEN
            RAISE EXCEPTION 'Lease release failed';
          END IF;

          -- Simulate a worker that stopped heartbeating: expiry must block its
          -- heartbeat/release and permit exactly one new owner to claim the lease.
          IF NOT aviator.claim_crash_engine_lease(next_owner, 10) THEN
            RAISE EXCEPTION 'Lease could not be reclaimed after release';
          END IF;
          UPDATE aviator.engine_worker_lease
          SET lease_expires_at = clock_timestamp() - interval '1 second'
          WHERE lease_key='aviator';
          IF aviator.heartbeat_crash_engine_lease(next_owner, 45) THEN
            RAISE EXCEPTION 'Expired worker heartbeat unexpectedly succeeded';
          END IF;
          IF NOT aviator.claim_crash_engine_lease(duplicate_owner, 45) THEN
            RAISE EXCEPTION 'New worker could not claim an expired lease';
          END IF;
          IF aviator.release_crash_engine_lease(next_owner) THEN
            RAISE EXCEPTION 'Expired previous worker released the new owner lease';
          END IF;
          IF aviator.claim_crash_engine_lease(first_owner, 45) THEN
            RAISE EXCEPTION 'Two workers acquired the lease after expiry';
          END IF;
          IF NOT aviator.release_crash_engine_lease(duplicate_owner) THEN
            RAISE EXCEPTION 'Reclaimed lease could not be released by its owner';
          END IF;
          PERFORM aviator.tick_crash_engine_with_broadcast();
          PERFORM aviator.tick_crash_engine_with_broadcast();
          IF NOT EXISTS (
            SELECT 1 FROM realtime.broadcast_events
            WHERE event_name = 'round_state_changed'
              AND topic = 'aviator:rounds'
              AND payload->>'multiplier' = '1.23'
              AND payload->>'id' = '00000000-0000-4000-8000-000000000001'
              AND payload ? 'serverTime'
              AND (payload->>'serverTime')::timestamptz IS NOT NULL
              AND (payload->>'tickSequence')::bigint = 2
          ) THEN
            RAISE EXCEPTION 'Authoritative multiplier sequence/server timestamp was not broadcast';
          END IF;
          IF (SELECT multiplier_tick_seq FROM aviator.game_rounds WHERE id='00000000-0000-4000-8000-000000000001') <> 2 THEN
            RAISE EXCEPTION 'Per-round multiplier sequence did not advance exactly twice';
          END IF;
        END
        $verify$;
        SQL

  validate-aviator-recovery-realtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
    - uses: actions/checkout@v4

    - name: Install PostgreSQL client
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-client

    - name: Create Aviator recovery and Realtime fixtures
      run: psql -v ON_ERROR_STOP=1 -f scripts/db/aviator-recovery-realtime-fixture.sql

    - name: Apply Aviator recovery and Realtime hardening migration
      run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261109090000_aviator_realtime_and_recovery_hardening.sql

    - name: Verify stale-round refunds, fail-closed behavior, and public broadcasts
      run: psql -v ON_ERROR_STOP=1 -f scripts/db/aviator-recovery-realtime-verify.sql

  validate-aviator-realtime-sequence:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Test monotonic Aviator multiplier event sequence
        run: bash scripts/db/test-aviator-realtime-sequence.sh
