name: Native Android CI

on:
  pull_request:
    paths:
      - "androidApp/**"
      - "gradle/**"
      - "gradle.properties"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/android-native.yml"
  push:
    branches: [main]
    paths:
      - "androidApp/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/android-native.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Assemble debug APK
        run: gradle --no-daemon :androidApp:assembleDebug
      - name: Run unit tests
        run: gradle --no-daemon :androidApp:testDebugUnitTest
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bigdaddy-native-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
